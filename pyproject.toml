[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitcp-mpc-writer"
version = "0.1.0"
description = "Cross-platform SiTCP/SiTCP-XG MPC/MPCX inspection and RBCP tools"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Nobuyuki Kobayashi et al."}]
dependencies = []

[project.scripts]
mpcx-mpc-writer = "sitcp_mpc_writer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
